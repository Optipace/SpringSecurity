server.port=8083

spring.application.name=api-gateway

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/admin/**,/users/**,/internal/**

spring.cloud.gateway.server.webflux.routes[2].id=audit-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://AUDIT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/audit/**

spring.cloud.gateway.server.webflux.routes[3].id=notification-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/ws/**

eureka.client.service-url.defaultZone=http://localhost:8763/eureka

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web=DEBUG

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET.POST,PUT,DELETE.OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*